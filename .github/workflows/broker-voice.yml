name: Broker customer voice
on:
  push:
    branches: [main]
    paths: ['.github/workflows/broker-voice.yml', 'broker_voice_collect.py']
  workflow_dispatch:
  schedule:
    - cron: '15 21,6 * * *'
permissions:
  contents: read
concurrency:
  group: broker-voice-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'jinhoo-choi/cafe-monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: python -m unittest -q test_broker_voice
      - run: python broker_voice_collect.py
        env:
          VOICE_NAVER_STATE: ${{ secrets.NAVER_COOKIES_JSON }}
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
