name: MAPS public snapshot one-off 20261006

on:
  push:
    branches: [work/maps-public-oneoff-20261006]
    paths:
      - .github/workflows/maps-public-oneoff.yml
      - tools/maps_public_oneoff/**

permissions:
  contents: read

concurrency:
  group: maps-public-oneoff-20261006
  cancel-in-progress: false

jobs:
  collect-public:
    if: >-
      github.repository == 'jinhoo-choi/cafe-monitor' &&
      github.event.created == true &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/work/maps-public-oneoff-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/maps_public_oneoff
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public collector dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/maps_public_oneoff/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect anonymous public search and encrypt in memory
        env:
          MAPS_EXECUTE: '1'
        run: >-
          python tools/maps_public_oneoff/collect.py
          --public-key tools/maps_public_oneoff/recipient-public.pem
          --output "$RUNNER_TEMP/maps-public-oneoff/envelope.json"
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: maps-public-oneoff-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/maps-public-oneoff/envelope.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
