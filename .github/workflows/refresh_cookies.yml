name: 네이버 쿠키 점검·조건부 갱신
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '전일 14:47 게시글의 24시간 경계 실환경 검증: SMTP·이력0'
        type: choice
        options: [check]
        default: check
permissions:
  contents: read
concurrency:
  group: naver-cafe-monitor
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/negative-full-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 검수 의존성 설치
        run: |
          pip install requests playwright jsonschema pyyaml pynacl
          playwright install --with-deps chromium
      - name: 전체 오프라인 회귀 검증
        run: python -m unittest -q test_negative_verification test_negative_subscription test_cookie_refresh test_cookie_provenance
      - name: 저장된 세션 복원
        env:
          NAVER_COOKIE_STATE: ${{ secrets.NAVER_COOKIES_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('naver_cookies.json').write_text(os.environ['NAVER_COOKIE_STATE'])
          Path('naver_cookies.json').chmod(0o600)
          PY
      - name: 실제 검색 후보·게시 시각·24시간 경계 검증 — 로그인0·SMTP0·이력0
        env:
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
          CLAUDE_API_KEY: ''
        run: |
          python - <<'PY'
          from contextlib import redirect_stdout
          from datetime import datetime,timedelta
          from io import StringIO
          import json,os
          from playwright.sync_api import sync_playwright
          from negative_queue import Queue,now
          from negative_verification import collector,item,published,seen_snapshot
          queue=Queue()
          queue.preflight()
          module=collector()
          before=seen_snapshot()[1]
          with redirect_stdout(StringIO()),sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(storage_state='naver_cookies.json')
              page=context.new_page()
              candidates=module.search_keyword(page,'divclub','31050378','한투')
              entry=next((x for x in candidates if x['post_id']=='66113'),None)
              assert entry is not None,'date-only candidate lost before detail verification'
              details={}
              _,body=module.get_post_detail(page,entry['url'],'divclub',details=details)
              assert details.get('date_str')=='2026.10.16. 14:47'
              instant=datetime.fromisoformat(published(details['date_str']))
              assert now()-timedelta(hours=24)<=instant<=now()
              current=item('divclub:66113',entry['title'],body,entry['url'],'cafe','live',details['date_str'])
              assert current['body_status']=='collected'
              context.close()
              browser.close()
          assert before==seen_snapshot()[1]
          report={'checked_at':now().isoformat(),'candidate_found':True,'actual_publication_time_verified':True,
                  'within_24_hours':True,'item':current,'smtp_calls':0,'paid_ai_calls':0,
                  'production_seen_writes':0,'seen_unchanged':True}
          queue.put('audits/date-boundary-'+os.environ['GITHUB_RUN_ID']+'.json',report)
          print(json.dumps({k:v for k,v in report.items() if k!='item'}))
          PY
      - name: 운영 이력 변경 없음 확인
        run: git diff --exit-code -- monitor.py seen_posts.json .github/workflows/monitor.yml
      - name: 임시 인증자료 제거
        if: always()
        run: rm -f naver_cookies.json naver_cookie_status.json .naver_cookie_*
