name: 네이버 쿠키 점검·조건부 갱신
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check는 로그인·Secret·메일 쓰기 없이 인증만 점검'
        type: choice
        options: [check, check_access, auto]
        default: check
      laptop_check:
        description: '검증 전 노트북에서 로그인·Secret·메일·큐 쓰기 없는 점검만 실행'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [cookie_refresh_request.json]
permissions:
  contents: read
concurrency:
  group: naver-cafe-monitor
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'jinhoo-choi/cafe-monitor' && github.ref == 'refs/heads/main'
    runs-on: negative-monitor-kr
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: '3.11'
      - name: 메타데이터 요청 검증
        id: request
        env:
          INPUT_MODE: ${{ inputs.mode }}
          LAPTOP_CHECK: ${{ inputs.laptop_check }}
        run: |
          python - <<'PY'
          import json,os,re
          mode=os.environ.get('INPUT_MODE')
          if os.environ['GITHUB_EVENT_NAME']=='push':
              value=json.load(open('cookie_refresh_request.json'))
              assert set(value)=={'operation','mode','request_id'}
              assert value['operation']=='cookie_preflight'
              assert re.fullmatch(r'[A-Za-z0-9_-]{1,80}',value['request_id'])
              mode=value['mode']
          assert mode in {'check','check_access','auto'}
          if os.environ.get('LAPTOP_CHECK') == 'true':
              assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
              assert mode in {'check','check_access'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('mode='+mode+'\n')
          PY
      - name: HTTP 패키지 설치
        if: runner.environment != 'self-hosted'
        run: pip install requests
      - name: 인증 패키지·브라우저 설치
        if: steps.request.outputs.mode != 'check_access' && runner.environment != 'self-hosted'
        run: |
          pip install playwright requests pynacl
          playwright install --with-deps chromium
      - name: 기존 쿠키 복원
        if: steps.request.outputs.mode != 'check_access'
        env:
          NAVER_COOKIE_STATE: ${{ secrets.NAVER_COOKIES_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          state=os.environ.get('NAVER_COOKIE_STATE','')
          if state:
              # Malformed state is handled by the sanitized preflight, never a raw traceback.
              Path('naver_cookies.json').write_text(state)
              Path('naver_cookies.json').chmod(0o600)
          PY
      - name: Secrets 공개키 읽기 권한만 진단 — 로그인0·쓰기0·메일0
        if: steps.request.outputs.mode == 'check_access'
        env:
          ADMIN_GITHUB_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
        run: python refresh_cookies.py --mode check_access
      - name: 실제 회원 본문 인증·필요시 1회 갱신 — API0·운영 발송0
        if: steps.request.outputs.mode != 'check_access'
        env:
          MODE: ${{ steps.request.outputs.mode }}
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
          NAVER_COOKIE_PROBES_JSON: ${{ secrets.NAVER_COOKIE_PROBES_JSON }}
          COOKIE_AUTO_RENEW_ENABLED: ${{ vars.COOKIE_AUTO_RENEW_ENABLED }}
          NAVER_ID: ${{ steps.request.outputs.mode == 'auto' && secrets.NAVER_ID || '' }}
          NAVER_PW: ${{ steps.request.outputs.mode == 'auto' && secrets.NAVER_PW || '' }}
          ADMIN_GITHUB_TOKEN: ${{ steps.request.outputs.mode == 'auto' && secrets.NEGATIVE_QUEUE_TOKEN || '' }}
          GMAIL_USER: ${{ steps.request.outputs.mode == 'auto' && secrets.GMAIL_USER || '' }}
          GMAIL_APP_PW: ${{ steps.request.outputs.mode == 'auto' && secrets.GMAIL_APP_PW || '' }}
        run: python refresh_cookies.py --mode "$MODE"
      - name: 쿠키·임시 인증자료 제거
        if: always()
        run: rm -f naver_cookies.json naver_cookie_status.json .naver_cookie_*
