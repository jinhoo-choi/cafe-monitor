name: 네이버 쿠키 점검·조건부 갱신
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Gmail 본인 검수 4건: 운영 수신자·이력 쓰기 0'
        type: choice
        options: [check]
        default: check
permissions:
  contents: read
concurrency:
  group: naver-cafe-monitor
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/negative-full-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 검수 의존성 설치
        run: pip install requests playwright jsonschema pyyaml pynacl
      - name: 전체 오프라인 회귀 재확인
        run: python -m unittest -q test_negative_verification test_negative_subscription test_cookie_refresh test_cookie_provenance
      - name: main 운영 이력 읽기 전용 스냅샷
        run: git show origin/main:seen_posts.json > /tmp/negative_production_seen.json
      - name: Gmail 한 주소로만 시나리오 4건 발송 및 재소비 중복 방지 확인
        env:
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
          NEGATIVE_SEEN_PATH: /tmp/negative_production_seen.json
          TEST_MODE: '1'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: 'myboy3743@gmail.com'
          EMAIL_CC: ''
          CLAUDE_API_KEY: ''
        run: |
          python - <<'PY'
          import hashlib,json,os
          from negative_queue import Queue,now
          from negative_verification import consume,owner,seen_snapshot
          assert owner()=='myboy3743@gmail.com'
          queue=Queue()
          queue.preflight()
          before=seen_snapshot()[1]
          reports=[]
          for job_id in ["negative-test-backlog-20261017T041912Z","negative-test-mixed-20261017T041912Z","negative-test-none-20261017T041912Z","negative-test-fresh-20261017T043541Z"]:
              consume(queue,job_id)
              consume(queue,job_id)
              job,_=queue.get('jobs/'+job_id+'.json')
              assert job['status']=='verified' and job['self_test'] is True
              assert job['production_recipients']==0 and job['production_seen_writes']==0
              assert job['receipts']=={hashlib.sha256(owner().encode()).hexdigest():'accepted'}
              reports.append({'job_id':job_id,'status':job['status'],'subject':job['test_subject'],'smtp_accepted':1})
          assert before==seen_snapshot()[1]
          report={'checked_at':now().isoformat(),'owner':owner(),'tests':reports,'smtp_accepted':len(reports),
                  'production_recipients':0,'production_seen_writes':0,'paid_ai_calls':0,
                  'reconsume_extra_sends':0,'seen_unchanged':True}
          queue.put('checks/mail-audit-'+os.environ['GITHUB_RUN_ID']+'.json',report)
          print(json.dumps({k:v for k,v in report.items() if k not in {'owner','tests'}}))
          PY
      - name: 운영 이력 변경 없음 확인
        run: git diff --exit-code -- seen_posts.json monitor.py .github/workflows/monitor.yml
