name: 네이버 쿠키 점검·조건부 갱신
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '과거글 점검: 로그인0·메일0·운영 이력 변경0'
        type: choice
        options: [check]
        default: check
permissions:
  contents: read
concurrency:
  group: naver-cafe-monitor
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/audit/naver-backfill-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 인증·수집 의존성 설치
        run: |
          pip install playwright requests pynacl jsonschema
          playwright install --with-deps chromium
      - name: 기존 Secret 복원
        env:
          NAVER_COOKIE_STATE: ${{ secrets.NAVER_COOKIES_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          Path('naver_cookies.json').write_text(os.environ['NAVER_COOKIE_STATE'])
          PY
      - name: 실제 회원 본문 사전 점검 — 로그인0·메일0
        env:
          NAVER_COOKIE_PROBES_JSON: ${{ secrets.NAVER_COOKIE_PROBES_JSON }}
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
        run: python refresh_cookies.py --mode check
      - name: 과거 미수집 글 점검 — 별도 비공개 감사 자료만 저장
        env:
          NEGATIVE_QUEUE_TOKEN: ${{ secrets.NEGATIVE_QUEUE_TOKEN }}
        run: python audit_naver_backfill.py
      - name: 임시 인증자료 제거
        if: always()
        run: rm -f naver_cookies.json naver_cookie_status.json .naver_cookie_*
