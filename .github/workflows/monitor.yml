name: 네이버 카페 부정여론 모니터링

on:
  workflow_dispatch:          # cron-job.org 또는 수동 실행
    inputs:
      dry_run:
        description: 'LLM 호출·메일 발송 없이 수집·필터만 검증 (비용 0)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: naver-cafe-monitor
  cancel-in-progress: false   # 실행 중 작업 강제 종료 방지 (DB 안전)

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # 무한 루프 / 블로킹 방지

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 네이버 쿠키 복원
        run: |
          cat > naver_cookies.json <<'EOF'
          ${{ secrets.NAVER_COOKIES_JSON }}
          EOF

      # 모니터링 실행 - workflow_dispatch(cron-job.org)일 때만
      - name: 모니터링 실행
        if: github.event_name == 'workflow_dispatch'
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          EMAIL_CC:       ${{ secrets.EMAIL_CC }}
          DRY_RUN:        ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py

      - name: DB 변경사항 커밋
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_posts.json || true
          git diff --cached --quiet || git commit -m "update seen_posts.json"
          # push 재시도: 동시 push로 non-fast-forward 실패 시 다음 실행이 중복 처리하는 것을 방지
          for i in 1 2 3; do
            git pull --rebase -q origin main || true
            git push origin main && break
            sleep $((i * 5))
          done
